name: PhotoSizeCleaner
options:
  bundleIdPrefix: com.shadowwolf
  xcodeVersion: "16.0"
  deploymentTarget:
    iOS: "17.0"
targets:
  PhotoSizeCleaner:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_NAME: PhotoSizeCleaner
        PRODUCT_BUNDLE_IDENTIFIER: com.shadowwolf.PhotoSizeCleaner
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: YES
